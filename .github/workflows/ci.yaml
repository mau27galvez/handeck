name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Typecheck, and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - name: Install Dependencies
        run: vp install

      - name: Copy .env.example files
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in **/.env.example; do
            cp "$file" "${file%.example}"
          done

      - name: Check
        run: vp check

      - name: Test
        run: vp test
