{{FrontSide}}

<hr class="handeck-divider handeck-divider--back" />

<div class="handeck-answer">
  <p class="answer-pinyin">{{Word Pinyin}}</p>
  <p class="answer-meaning">{{Word Translations}}</p>
  <section class="answer-sentence">
    <p class="answer-sentence-hanzi">{{Sentence Hanzi}}</p>
    {{#Sentence Pinyin}}
    <p class="answer-sentence-pinyin">{{Sentence Pinyin}}</p>
    {{/Sentence Pinyin}} {{#Sentence Translation}}
    <p class="answer-sentence-translation">{{Sentence Translation}}</p>
    {{/Sentence Translation}}
  </section>

  <!-- Reserved for word + sentence audio controls -->
  <div class="audio-controls" hidden aria-hidden="true"></div>
</div>
